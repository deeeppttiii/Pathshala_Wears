{% extends 'base.html' %}

{% block title %}Add Product - Pathshala Wears{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl">
  <section class="app-card p-6 sm:p-8">
    <div class="mb-6">
      <p class="page-kicker">Inventory</p>
      <h1 class="section-title mt-1">Add Product</h1>
    </div>

    <form method="post" enctype="multipart/form-data" class="space-y-5">
      {% csrf_token %}
      {% for field in form %}
        <label class="block">
          <span class="mb-2 block text-sm font-bold text-stone-700">{{ field.label }}</span>
          {% if field.field.widget.input_type == 'textarea' %}
            <textarea name="{{ field.name }}" id="{{ field.id_for_label }}" rows="4" class="w-full px-4 py-3" {% if field.field.required %}required{% endif %}>{{ field.value|default:'' }}</textarea>
          {% elif field.field.widget.input_type == 'select' %}
            <select name="{{ field.name }}" id="{{ field.id_for_label }}" class="h-12 w-full px-4" {% if field.field.required %}required{% endif %}>
              {% for choice in field.field.choices %}
                <option value="{{ choice.0 }}" {% if choice.0 == field.value %}selected{% endif %}>{{ choice.1 }}</option>
              {% endfor %}
            </select>
          {% else %}
            <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.name }}" id="{{ field.id_for_label }}" value="{{ field.value|default:'' }}" class="h-12 w-full px-4" {% if field.field.required %}required{% endif %}>
          {% endif %}
          {% if field.errors %}
            <p class="mt-1 text-sm font-semibold text-rose-700">{{ field.errors.0 }}</p>
          {% endif %}
        </label>
      {% endfor %}
      <button type="submit" class="btn-primary w-full"><i class="fas fa-plus"></i> Add Product</button>
    </form>

    <a href="{% url 'products:product_list' %}" class="btn-outline mt-5 w-full"><i class="fas fa-arrow-left"></i> Back to Products</a>
  </section>
</div>
{% endblock %}
