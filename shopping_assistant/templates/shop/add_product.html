{% extends 'base.html' %}

{% block title %}Add Product - Pathshala Wears{% endblock %}

{% block content %}
<div style="max-width: 760px; margin: 0 auto;">
  <section class="app-card" style="padding: 30px;">
    <div style="margin-bottom: 24px;">
      <p class="page-kicker">Inventory</p>
      <h1 class="section-title">Add Product</h1>
    </div>

    <form method="post" enctype="multipart/form-data" class="form-grid">
      {% csrf_token %}
      {% for field in form %}
        <label class="field">
          <span>{{ field.label }}</span>
          {% if field.field.widget.input_type == 'textarea' %}
            <textarea name="{{ field.name }}" id="{{ field.id_for_label }}" rows="4" {% if field.field.required %}required{% endif %}>{{ field.value|default:'' }}</textarea>
          {% elif field.field.widget.input_type == 'select' %}
            <select name="{{ field.name }}" id="{{ field.id_for_label }}" {% if field.field.required %}required{% endif %}>
              {% for choice in field.field.choices %}
                <option value="{{ choice.0 }}" {% if choice.0 == field.value %}selected{% endif %}>{{ choice.1 }}</option>
              {% endfor %}
            </select>
          {% elif field.field.widget.input_type == 'checkbox' %}
            <span class="payment-option" style="justify-content: flex-start;">
              <input type="checkbox" name="{{ field.name }}" id="{{ field.id_for_label }}" {% if field.value %}checked{% endif %}>
              <strong>{{ field.help_text|default:"Enable this option" }}</strong>
            </span>
          {% else %}
            <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.name }}" id="{{ field.id_for_label }}" value="{{ field.value|default:'' }}" {% if field.field.required %}required{% endif %}>
          {% endif %}
          {% if field.errors %}
            <p style="color: var(--danger); font-weight: 800;">{{ field.errors.0 }}</p>
          {% endif %}
        </label>
      {% endfor %}
      <button type="submit" class="btn-primary" style="width: 100%;"><i class="fas fa-plus"></i> Add Product</button>
    </form>

    <a href="{% url 'products:product_list' %}" class="btn-outline" style="width: 100%; margin-top: 18px;"><i class="fas fa-arrow-left"></i> Back to Products</a>
  </section>
</div>
{% endblock %}
