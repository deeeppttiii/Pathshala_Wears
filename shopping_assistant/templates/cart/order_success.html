{% extends 'base.html' %}

{% block title %}Order Successful{% endblock %}

{% block content %}
<div class="empty-state mx-auto max-w-xl">
  <span class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-emerald-50 text-3xl text-emerald-700">
    <i class="fas fa-check"></i>
  </span>
  <h1 class="text-3xl font-extrabold text-stone-950">Thank you for your purchase.</h1>
  <p class="mt-3 text-stone-500">Your order has been placed successfully. We will contact you soon with the next steps.</p>
  <a href="{% url 'products:product_list' %}" class="btn-primary mt-6"><i class="fas fa-store"></i> Back to Shop</a>
</div>
{% endblock %}
