{% extends 'base.html' %}

{% block title %}Payment Failed{% endblock %}

{% block content %}
<div class="empty-state mx-auto max-w-xl">
  <span class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-rose-50 text-3xl text-rose-700">
    <i class="fas fa-xmark"></i>
  </span>
  <h1 class="text-3xl font-extrabold text-stone-950">Payment failed</h1>
  <p class="mt-3 text-stone-500">Unfortunately, your payment could not be processed. Please try again or choose another method.</p>
  <a href="{% url 'cart:checkout' %}" class="btn-primary mt-6"><i class="fas fa-arrow-left"></i> Back to Checkout</a>
</div>
{% endblock %}
